name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: python -m pip install -r src/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m compileall -q src tests
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($_.Name):"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
